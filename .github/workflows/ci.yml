name: Validate serverless demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests (no AWS credentials needed)
        run: python -m unittest discover -s aws-demo/tests -v
      - name: Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Terraform format
        working-directory: aws-demo/terraform
        run: terraform fmt -check -recursive
      - name: Terraform validate (no AWS calls)
        working-directory: aws-demo/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
