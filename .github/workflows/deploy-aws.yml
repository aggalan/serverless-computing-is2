name: Terraform deploy (explicit opt-in)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Acción sobre la infraestructura (AWS Academy necesita credenciales temporales vigentes)'
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan
  push:
    branches: [main]
    paths:
      - 'aws-demo/src/**'
      - 'aws-demo/terraform/**'
      - '.github/workflows/deploy-aws.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-serverless-demo
  cancel-in-progress: false

jobs:
  deploy:
    # Manual workflow_dispatch requiere seleccionar plan/apply/destroy.
    # Por defecto, cada push corre solo CI; habilitar AUTO_DEPLOY=true explícitamente.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true' }}
    environment: aws-demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aws-demo/terraform
        shell: bash
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_lambda_role_name: ${{ vars.LAMBDA_ROLE_NAME || 'LabRole' }}
      TF_VAR_lambda_execution_role_arn: ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false

      # Cuentas AWS normales: IAM OIDC con sub limitado al repo/branch.
      - name: AWS credentials (OIDC)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      # Learner Lab: credenciales de sesión; deben renovarse al vencer.
      - name: Check AWS Academy GitHub Secrets
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        env:
          ACADEMY_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ACADEMY_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ACADEMY_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$ACADEMY_ACCESS_KEY_ID" || -z "$ACADEMY_SECRET_ACCESS_KEY" || -z "$ACADEMY_SESSION_TOKEN" ]]; then
            echo "::error::Faltan Secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y/o AWS_SESSION_TOKEN. Configuralos en GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: AWS credentials (Academy session)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Verify account and bootstrap private S3 Terraform state
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_STATE_BUCKET:-itba-serverless-is2-tfstate-${ACCOUNT_ID}-${AWS_REGION}}"
          echo "Terraform state bucket: $BUCKET (region $AWS_REGION)"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket not found or inaccessible; attempting creation..."
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi
          aws s3api head-bucket --bucket "$BUCKET"
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          if ! aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled; then
            echo "::warning::No se pudo habilitar versionado S3 para Terraform state; revisá permisos del Lab."
          fi
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Enable persistent remote Terraform state
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=serverless-computing-is2/demo/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        env:
          OPERATION: ${{ github.event.inputs.operation }}
        run: |
          if [[ "$OPERATION" == "destroy" ]]; then
            terraform plan -destroy -input=false -out=tfplan -no-color
          else
            terraform plan -input=false -out=tfplan -no-color
          fi

      - name: Apply plan (only when requested)
        if: ${{ github.event_name == 'push' || github.event.inputs.operation == 'apply' || github.event.inputs.operation == 'destroy' }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Verify health after apply (wait for route propagation)
        if: ${{ github.event_name == 'push' || github.event.inputs.operation == 'apply' }}
        run: |
          set -euo pipefail
          URL=$(terraform output -raw api_url)
          URL="${URL%/}"
          echo "Comprobando $URL/health (HTTP API puede tardar en publicar rutas)"
          BODY=$(mktemp)
          HEADERS=$(mktemp)
          trap 'rm -f "$BODY" "$HEADERS"' EXIT
          READY=false

          for attempt in $(seq 1 15); do
            STATUS=$(curl --silent --show-error --max-time 15 \
              -H 'Origin: http://localhost:8000' \
              -D "$HEADERS" -o "$BODY" -w '%{http_code}' \
              "$URL/health" || true)
            echo "Intento $attempt/15: HTTP ${STATUS:-sin respuesta}"
            if [[ "$STATUS" == "200" ]] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$BODY"; then
              CORS_ORIGIN=$(tr -d '\r' < "$HEADERS" | grep -i '^access-control-allow-origin:' | tail -1 | sed 's/^[^:]*:[[:space:]]*//' || true)
              if [[ "$CORS_ORIGIN" == "*" || "$CORS_ORIGIN" == "http://localhost:8000" ]]; then
                READY=true
                echo "GET /health y CORS OK"
                cat "$BODY"
                echo
                break
              fi
              echo "La respuesta es 200 pero CORS todavía no está disponible."
            fi
            if [[ "$attempt" -lt 15 ]]; then sleep 5; fi
          done

          if [[ "$READY" != true ]]; then
            echo "::error::API no lista luego de 15 intentos (HTTP $STATUS). Revisá stage, rutas e integración."
            echo "Cuerpo de respuesta:"
            head -c 1000 "$BODY" || true
            echo
            echo "Encabezados:"
            head -c 2000 "$HEADERS" || true
            echo
            exit 1
          fi

          echo "### API desplegada" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Health/CORS: OK" >> "$GITHUB_STEP_SUMMARY"
